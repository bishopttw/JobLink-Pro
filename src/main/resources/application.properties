# Server configuration
server.port=8080
# In-Memory Database Configuration (Perfect for instant demonstration)
spring.datasource.url=jdbc:h2:mem:joblinkdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Show SQL operations in terminal
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Enable H2 Database Console access (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# === PERMANENT SUPABASE DATABASE ===
supabase.datasource.url=${DB_URL}
supabase.datasource.username=${DB_USERNAME}
supabase.datasource.password=${DB_PASSWORD}