<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Node Onboarding</title>
    <style>
        body { background: #090d16; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #131926; border: 1px solid rgba(255,255,255,0.06); padding: 40px; border-radius: 16px; width: 320px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; box-sizing: border-box; }
        input { background: #090d16; border: 1px solid rgba(255,255,255,0.1); color: white; }
        button { background: #10b981; color: white; border: none; font-weight: bold; cursor: pointer; }
        a { color: #94a3b8; text-decoration: none; font-size: 14px; display: block; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h2>Ecosystem Registration</h2>
    <form action="/register" method="POST">
        <input type="text" name="username" placeholder="Choose Identifier Handle" required>
        <input type="password" name="password" placeholder="Secure Secret Cipher" required>
        <button type="submit">Complete Registry</button>
    </form>
    <a href="/">Return to Gatekeeper</a>
</div>
</body>
</html>
